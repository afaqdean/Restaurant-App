<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      @font-face {
        font-family: "Aspekta";
        src: url("/fonts/Aspekta-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Aspekta";
        src: url("/fonts/Aspekta-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      body {
        font-family: "Aspekta", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background: white;
        margin: 0;
        padding: 0;
      }
      .receipt-container {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        background: #faf8f5;
        color: #2d3748;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .logo {
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid #e2e8f0;
      }
      .logo h1 {
        font-size: 28px;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: linear-gradient(135deg, #10b981 0%, #06d6a0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .logo-icon {
        width: 28px;
        height: 28px;
        color: #10b981;
      }
      .customer-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 25px;
        padding: 15px 0;
        border-bottom: 1px solid #e2e8f0;
      }
      .customer-details {
        flex: 1;
      }
      .bill-to {
        font-size: 12px;
        font-weight: 600;
        color: #718096;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 5px;
      }
      .customer-name {
        font-size: 16px;
        font-weight: 600;
        color: #2d3748;
        margin-bottom: 3px;
      }
      .customer-phone {
        font-size: 14px;
        color: #718096;
      }
      .items-section {
        margin-bottom: 25px;
      }
      .items-header {
        display: grid;
        grid-template-columns: 1fr 80px 100px 100px;
        gap: 15px;
        padding: 12px 0;
        border-bottom: 2px solid #e2e8f0;
        font-size: 12px;
        font-weight: 600;
        color: #718096;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .items-header > div:nth-child(3),
      .items-header > div:nth-child(4) {
        text-align: right;
      }
      .item-row {
        display: grid;
        grid-template-columns: 1fr 80px 100px 100px;
        gap: 15px;
        padding: 12px 0;
        border-bottom: 1px solid #f7fafc;
        font-size: 14px;
        align-items: start;
      }
      .item-name {
        font-weight: 600;
        color: #2d3748;
      }
      .item-options {
        font-size: 12px;
        color: #718096;
        margin-top: 3px;
        font-style: italic;
      }
      .item-notes {
        font-size: 12px;
        color: #d69e2e;
        font-style: italic;
        margin-top: 3px;
        background: #fef5e7;
        padding: 2px 6px;
        border-radius: 3px;
        display: inline-block;
      }
      .quantity {
        text-align: center;
        font-weight: 600;
        color: #4a5568;
      }
      .price {
        text-align: right;
        font-weight: 600;
        color: #4a5568;
      }
      .total {
        text-align: right;
        font-weight: 700;
        color: #2d3748;
      }
      .totals-section {
        border-top: 2px solid #e2e8f0;
        padding-top: 20px;
        margin-top: 20px;
      }
      .total-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        font-size: 14px;
        border-bottom: 1px solid #f7fafc;
      }
      .total-label {
        font-weight: 600;
        color: #4a5568;
      }
      .total-value {
        font-weight: 600;
        color: #2d3748;
      }
      .grand-total {
        font-size: 18px;
        font-weight: 700;
        color: #1a202c;
        border-top: 2px solid #e2e8f0;
        padding-top: 15px;
        margin-top: 15px;
      }
      .footer {
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
      }
      .thank-you {
        font-weight: 600;
        color: #2d3748;
        margin-bottom: 8px;
      }
      .visit-again {
        font-size: 14px;
        color: #718096;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="receipt-container">
      <!-- Logo -->
      <div class="logo">
        <h1>
          <i data-lucide="utensils" class="logo-icon"></i>
          Delicious Bites
        </h1>
      </div>

      <!-- Customer Info -->
      <div class="customer-info">
        <div class="customer-details">
          <div class="bill-to">Bill To:</div>
          <div class="customer-name" id="customer-name"></div>
          <div class="customer-phone" id="customer-phone"></div>
        </div>
      </div>

      <!-- Order Items -->
      <div class="items-section">
        <div class="items-header">
          <div>Description</div>
          <div>Quantity</div>
          <div>Price</div>
          <div>Total</div>
        </div>
        <div id="order-items">
          <!-- Items will be populated here -->
        </div>
      </div>

      <!-- Totals -->
      <div class="totals-section">
        <div class="total-row">
          <span class="total-label">Subtotal:</span>
          <span class="total-value" id="subtotal"></span>
        </div>
        <div class="total-row" id="discount-row" style="display: none">
          <span class="total-label">Discount:</span>
          <span class="total-value" id="discount"></span>
        </div>
        <div class="total-row">
          <span class="total-label">Tax (8.5%):</span>
          <span class="total-value" id="tax"></span>
        </div>
        <div class="total-row">
          <span class="total-label">Service Fee (3%):</span>
          <span class="total-value" id="service-fee"></span>
        </div>
        <div class="total-row grand-total">
          <span class="total-label">Net Amount:</span>
          <span class="total-value" id="total"></span>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <div class="thank-you">Thank you for ordering!</div>
        <div class="visit-again">Please visit us again soon!</div>
      </div>
    </div>

    <script>
      // Format price function (prices are stored in cents)
      function formatPrice(cents) {
        const dollars = cents / 100;
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
        }).format(dollars);
      }

      // This will be populated by the server
      function populateReceipt(data) {
        console.log("Receipt data received:", data);

        // Customer Information
        document.getElementById("customer-name").textContent =
          data.customerName || "N/A";
        document.getElementById("customer-phone").textContent =
          data.customerPhone || "N/A";

        // Order Items Table
        const itemsContainer = document.getElementById("order-items");

        if (data.items && data.items.length > 0) {
          data.items.forEach((item) => {
            const itemPrice =
              item.price +
              (item.options
                ? item.options.reduce((sum, opt) => sum + opt.price, 0)
                : 0);
            const itemTotal = itemPrice * item.quantity;

            const row = document.createElement("div");
            row.className = "item-row";

            // Item name with options and notes
            let itemNameHtml = `
              <div class="item-name">${item.item.name}</div>
            `;

            if (item.options && item.options.length > 0) {
              itemNameHtml += `
                <div class="item-options">
                  ${item.options
                    .map(
                      (opt) =>
                        `+ ${opt.option.name} (${formatPrice(opt.price)})`
                    )
                    .join(", ")}
                </div>
              `;
            }

            if (item.notes) {
              itemNameHtml += `
                <div class="item-notes">Note: ${item.notes}</div>
              `;
            }

            row.innerHTML = `
              <div class="item-name">${itemNameHtml}</div>
              <div class="quantity">${item.quantity}</div>
              <div class="price">${formatPrice(itemPrice)}</div>
              <div class="total">${formatPrice(itemTotal)}</div>
            `;

            itemsContainer.appendChild(row);
          });
        } else {
          const row = document.createElement("div");
          row.className = "item-row";
          row.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 20px; color: #718096;">
              No items in this order
            </div>
          `;
          itemsContainer.appendChild(row);
        }

        // Totals
        document.getElementById("subtotal").textContent = formatPrice(
          data.subtotal
        );

        if (data.totalDiscount > 0) {
          document.getElementById("discount-row").style.display = "flex";
          document.getElementById("discount").textContent = `-${formatPrice(
            data.totalDiscount
          )}`;
        }

        document.getElementById("tax").textContent = formatPrice(data.tax);
        document.getElementById("service-fee").textContent = formatPrice(
          data.serviceFee
        );
        document.getElementById("total").textContent = formatPrice(data.total);
      }

      // Initialize Lucide icons
      if (typeof lucide !== "undefined") {
        lucide.createIcons();
      }

      // Populate with data when available
      if (window.receiptData) {
        populateReceipt(window.receiptData);
      }
    </script>
  </body>
</html>
